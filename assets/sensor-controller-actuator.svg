  <line x1="420" y1="80" x2="468" y2="80" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="80" x2="688" y2="80" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="115" y="140" font-size="12" text-anchor="middle" fill="#222">Ultrasonic, IR, LDR, keypad</text>
  <text x="335" y="140" font-size="12" text-anchor="middle" fill="#222">Arduino</text>
  <text x="555" y="140" font-size="12" text-anchor="middle" fill="#222">Servo, motor, fan, buzzer, LED</text>
  <text x="775" y="140" font-size="12" text-anchor="middle" fill="#222">Lid opens, robot moves,</text>
  <text x="775" y="156" font-size="12" text-anchor="middle" fill="#222">alarm sounds</text>
  <text x="30" y="200" font-size="11" fill="#444">Generic pattern drawn by me. The examples come from the projects in this repository.</text>
